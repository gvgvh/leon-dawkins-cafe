<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table QR Codes - Leon Dawkins Cafe</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 30px 20px;
            margin: 0;
        }

        .header {
            max-width: 1100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 { margin: 0; font-size: 26px; }
        p { color: #64748b; margin: 4px 0 0; }

        .btn-print {
            background-color: #eab308;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .qr-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .qr-card {
            background: white;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            page-break-inside: avoid;
        }

        .qr-card h2 {
            font-size: 24px;
            margin: 0 0 4px;
            color: #0f172a;
        }

        .qr-card .cafe-name {
            font-size: 13px;
            font-weight: 700;
            color: #ca8a04;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .qr-image-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            padding: 12px;
            background: #fafafa;
            border-radius: 12px;
        }

        .qr-image-box img {
            width: 170px;
            height: 170px;
            display: block;
        }

        .qr-card .instructions {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.4;
        }

        .qr-url {
            font-size: 11px;
            font-family: monospace;
            color: #94a3b8;
            margin-top: 8px;
            word-break: break-all;
        }

        @media print {
            .btn-print, .header p { display: none; }
            body { background: white; padding: 0; }
            .qr-card { border: 2px solid #000; box-shadow: none; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>📱 Table QR Code Placards</h1>
            <p>Print and place these on each table. Customers scan with their phone camera to order.</p>
        </div>
        <button type="button" class="btn-print" onclick="window.print()">🖨️ Print All Table Cards</button>
    </div>

    <div class="qr-grid" id="qr-container">
        <!-- Rendered dynamically for tables 1 through 10 -->
    </div>

    <script>
        const baseUrl = window.location.origin;
        const container = document.getElementById('qr-container');

        for (let i = 1; i <= 10; i++) {
            const tableUrl = `${baseUrl}/?table=${i}`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(tableUrl)}`;

            const card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <div class="cafe-name">Leon Dawkins Cafe</div>
                <h2>Table #${i}</h2>
                <div class="qr-image-box">
                    <img src="${qrApiUrl}" alt="QR code for Table ${i}">
                </div>
                <div class="instructions">
                    Scan with camera to view menu & pay via M-Pesa
                </div>
                <div class="qr-url">${tableUrl}</div>
            `;
            container.appendChild(card);
        }
    </script>
</body>
</html>
