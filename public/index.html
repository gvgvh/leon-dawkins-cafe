<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon Dawkins Cafe - QR Menu & M-Pesa Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h2>🍽️ Leon Dawkins</h2>
            </div>
            <div class="navbar-center">
                <span class="table-info">Table <strong id="table-number">1</strong></span>
            </div>
            <div class="navbar-right">
                <button class="cart-toggle" onclick="toggleCart()">
                    🛒 Cart <span class="cart-count" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Leon Dawkins Cafe</h1>
            <p class="tagline">Fresh • Delicious • Fast M-Pesa Payments</p>
            <p class="subtitle">Order from your phone. Get fresh food. Pay with M-Pesa.</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Category Navigation -->
        <div class="category-nav">
            <button class="cat-btn active" onclick="showCategory('All')">All Items</button>
            <button class="cat-btn" onclick="showCategory('Breakfast')">🌅 Breakfast</button>
            <button class="cat-btn" onclick="showCategory('Main Meals')">🍲 Main Meals</button>
            <button class="cat-btn" onclick="showCategory('Grills')">🔥 Grills</button>
            <button class="cat-btn" onclick="showCategory('Snacks')">🥪 Snacks</button>
            <button class="cat-btn" onclick="showCategory('Sides')">🥗 Sides</button>
            <button class="cat-btn" onclick="showCategory('Drinks')">🥤 Drinks</button>
            <button class="cat-btn" onclick="showCategory('Desserts')">🍰 Desserts</button>
        </div>

        <!-- Section Title -->
        <div class="section-header">
            <h2 id="category-title">All Items</h2>
            <p class="item-count" id="item-count"></p>
        </div>

        <!-- Food Items Grid -->
        <div class="food-grid" id="food-container">
            <!-- Dynamically loaded via script.js -->
        </div>

    </div>

    <!-- Right Sidebar: Shopping Cart -->
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Order Summary</h3>
            <button class="close-btn" onclick="toggleCart()">✕</button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <p class="empty-cart">Your cart is empty</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span class="total-price" id="total-price">KES 0</span>
            </div>

            <!-- Checkout Form -->
            <div class="checkout-section">
                <h4>Checkout</h4>
                
                <input 
                    type="text" 
                    id="customerName" 
                    placeholder="Your Name" 
                    class="input-field"
                />
                
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    placeholder="M-Pesa Phone (254...)" 
                    class="input-field"
                />
                
                <textarea 
                    id="orderNotes" 
                    placeholder="Special requests (optional)" 
                    class="input-field textarea"
                    rows="2"
                ></textarea>

                <button class="btn-checkout" onclick="processOrder()">
                    Pay with M-Pesa
                </button>
                
                <p class="checkout-info">
                    💳 You'll receive an STK push to enter your M-Pesa PIN
                </p>
            </div>
        </div>
    </aside>

    <!-- Cart Overlay (for mobile) -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

    <!-- Toast Notifications -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
